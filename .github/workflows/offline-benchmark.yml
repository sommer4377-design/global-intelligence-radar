name: Radar internal pipeline rehearsal
on:
  workflow_dispatch:
    inputs:
      model_probe:
        description: Run the bounded cold download and CPU inference probe
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: radar-internal-pipeline-test
  cancel-in-progress: false
jobs:
  rehearsal:
    if: github.repository == 'sommer4377-design/global-intelligence-radar' && github.ref == 'refs/heads/ci/radar-internal-pipeline' && github.event.repository.private == false && vars.RADAR_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify environment and install bounded dependencies
        run: |
          uname -m
          python --version
          test "$(uname -s)" = Linux
          test -w "$RUNNER_TEMP"
          timeout 150 python -m pip install --no-cache-dir -r requirements-offline.txt
          python -c 'import ctranslate2, sentencepiece, sqlite3; print(sqlite3.sqlite_version)'
      - name: Run state, failure and rollback tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest test_internal_pipeline -v
      - name: Run resumable mock batch
        run: |
          set -eu
          p="$RUNNER_TEMP/radar-mock"
          args=(--root "$p" --mode mock --dry-run --batch 2026-11-22-08)
          set +e
          python internal_pipeline.py "${args[@]}" --fail-stage notify
          rc=$?
          set -e
          test "$rc" = 1
          python internal_pipeline.py "${args[@]}" --resume
          cat "$p/runs/2026-11-22-08/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Run real acquisition and evidence with release blocked
        run: |
          set -eu
          trial="$RUNNER_TEMP/radar-real"
          slot="$(python -c 'from internal_pipeline import slot_id, BEIJING; from datetime import datetime; print(slot_id(datetime.now(BEIJING)))')"
          python internal_pipeline.py --root "$trial" --mode real --dry-run --batch "$slot" --limit 4
          cat "$trial/runs/$slot/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check synthetic artifact size and clean boundaries
        if: always()
        run: |
          is_mock="$RUNNER_TEMP/radar-mock"
          if test -d "$is_mock"; then test "$(du -sk "$is_mock" | cut -f1)" -lt 1024; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-mock-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/radar-mock/internal-pipeline.sqlite3
            ${{ runner.temp }}/radar-mock/archive/
            ${{ runner.temp }}/radar-mock/simulation/
            ${{ runner.temp }}/radar-mock/runs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-audit-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/radar-real/runs/*/report.json
            ${{ runner.temp }}/radar-real/runs/*/report.md
      - name: Cold download and CPU model probe
        if: inputs.model_probe
        run: bash ci/internal-model-probe.sh
  restore:
    needs: rehearsal
    if: always() && needs.rehearsal.result != 'skipped' && github.ref == 'refs/heads/ci/radar-internal-pipeline' && vars.RADAR_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: internal-mock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/restored-mock
      - name: Verify SQLite on a new Ubuntu runner
        run: |
          set -eu
          p="$RUNNER_TEMP/restored-mock"
          test -f "$p/internal-pipeline.sqlite3"
          cp "$p/runs/2026-11-22-08/report.json" "$RUNNER_TEMP/previous.json"
          python internal_pipeline.py --root "$p" --mode mock --dry-run --batch 2026-11-22-08 --resume
          cmp "$RUNNER_TEMP/previous.json" "$p/runs/2026-11-22-08/report.json"
          ROOT="$p" python -c 'import os,sqlite3; db=sqlite3.connect(os.path.join(os.environ["ROOT"],"internal-pipeline.sqlite3")); assert db.execute("PRAGMA integrity_check").fetchone()==("ok",); assert db.execute("SELECT count(*) FROM pipeline_notice").fetchone()==(1,)'
